<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Tree Lens</title>
<style>
  /* EDIT COLORS HERE */
  :root {
    --bg: #ffffff; --text: #202124; --muted: #5f6368; --line: #e3e5e8; --hover: #f1f3f4; --accent: #16a34a;
    --accent-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --hover: #303134; --accent: #4ade80;
            --accent-text: #06210f; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; font: 15px/1.4 "Segoe UI", sans-serif; color: var(--text);
               -webkit-user-select: none; user-select: none; }
  #wrap { margin: 10px; }
  .box { background: var(--bg); border-radius: 28px; box-shadow: 0 4px 24px rgba(0,0,0,.35); overflow: hidden; }
  .pill { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 12px 0 20px; }
  .pill svg { flex: none; }
  input { flex: 1; border: 0; outline: 0; background: transparent; color: var(--text); font: 18px "Segoe UI", sans-serif; }
  input::placeholder { color: var(--muted); }
  #lens-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: transparent; color: var(--accent);
              cursor: pointer; display: grid; place-items: center; }
  #lens-btn:hover { background: var(--hover); }
  #list, #lens { display: none; border-top: 1px solid var(--line); }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 20px; cursor: pointer; }
  .row.sel, .row:hover { background: var(--hover); }
  .row .ico { width: 24px; text-align: center; }
  .row small { color: var(--muted); margin-left: auto; }
  #lens { padding: 14px 20px 16px; }
  .chips { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
  .chip { border: 1px solid var(--line); background: transparent; color: var(--text); border-radius: 16px;
          padding: 5px 14px; cursor: pointer; font: inherit; font-size: 14px; }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  #lang { display: none; width: 110px; border: 1px solid var(--line); border-radius: 16px; padding: 4px 10px;
          font-size: 14px; -webkit-user-select: text; user-select: text; }
  .body { display: flex; gap: 14px; align-items: flex-start; }
  #thumb { max-width: 200px; max-height: 200px; border-radius: 10px; border: 1px solid var(--line); flex: none; }
  #answer { flex: 1; white-space: pre-wrap; max-height: 300px; overflow: auto; -webkit-user-select: text; user-select: text; }
  #status { color: var(--muted); font-size: 13px; }
  #copy { margin-top: 8px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="box">
    <div class="pill">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--muted)">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>
      </svg>
      <input id="q" placeholder="Search apps or the web, or use Lens" autocomplete="off" spellcheck="false">
      <button id="lens-btn" title="Search your screen with Lens">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div id="list"></div>
    <div id="lens">
      <div class="chips" id="chips">
        <button class="chip on" data-mode="describe">Describe</button>
        <button class="chip" data-mode="identify">Identify</button>
        <button class="chip" data-mode="translate">Translate</button>
        <input id="lang" value="English" title="Translate into">
      </div>
      <div class="body">
        <img id="thumb" alt="">
        <div style="flex:1">
          <div id="status"></div>
          <div id="answer"></div>
          <button class="chip" id="copy">Copy</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="bar.js"></script>
</body>
</html>
