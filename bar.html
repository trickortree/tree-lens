<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'self'">
<title>Tree Lens</title>
<style>
  /* EDIT COLORS HERE */
  :root {
    --bg: #ffffff; --text: #1f1f1f; --muted: #5f6368; --line: #dadce0; --hover: #f1f3f4; --field: #ffffff;
    --accent: #0b57d0; --accent-text: #ffffff; --bubble: #f1f3f4; --chip: #e8f0fe; --good: #188038; --bad: #d93025;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #202124; --text: #e8eaed; --muted: #9aa0a6; --line: #3c4043; --hover: #303134; --field: #28292c;
            --accent: #8ab4f8; --accent-text: #202124; --bubble: #303134; --chip: #2d3e5a; --good: #81c995; --bad: #f28b82; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 15px/1.45 "Segoe UI", sans-serif;
               color: var(--text); -webkit-user-select: none; user-select: none; }
  #wrap { height: calc(100% - 20px); margin: 10px; }
  .box { height: 100%; display: flex; background: var(--bg); border-radius: 28px; box-shadow: 0 4px 24px rgba(0,0,0,.35);
         overflow: hidden; position: relative; }
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* sidebar with old chats */
  #side { display: none; width: 230px; flex: none; border-right: 1px solid var(--line); flex-direction: column; padding: 14px 8px 10px; }
  #side h3 { margin: 4px 10px 8px; font-size: 14px; color: var(--muted); font-weight: 600; }
  #chats { flex: 1; overflow-y: auto; }
  .chat-row { display: flex; align-items: center; gap: 4px; padding: 7px 10px; border-radius: 12px; cursor: pointer; font-size: 14px; }
  .chat-row:hover, .chat-row.on { background: var(--hover); }
  .chat-row span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-row button { opacity: 0; border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 16px; }
  .chat-row:hover button { opacity: 1; }

  /* header */
  .top { flex: none; display: flex; align-items: center; height: 58px; padding: 0 14px; -webkit-app-region: drag; }
  .top button { -webkit-app-region: no-drag; }
  .top .mid { flex: 1; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 22px; }
  .keys { font-size: 13px; color: var(--muted); background: var(--hover); border-radius: 6px; padding: 2px 8px; }
  .ib { width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--text);
        cursor: pointer; display: grid; place-items: center; flex: none; }
  .ib:hover { background: var(--hover); }
  .ib.on { background: var(--chip); color: var(--accent); }
  #pin-btn.on { background: var(--accent); color: var(--accent-text); }
  #pin-btn.on svg { fill: currentColor; }
  .ib svg { pointer-events: none; }
  #menu { display: none; position: absolute; top: 52px; left: 12px; z-index: 5; min-width: 270px; padding: 6px 0;
          background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  #menu div { padding: 8px 18px; cursor: pointer; display: flex; justify-content: space-between; gap: 18px; }
  #menu div:hover { background: var(--hover); }
  #menu #m-models { display: block; padding: 0; }
  #menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
  #menu .sub { padding-left: 30px; font-size: 13.5px; color: var(--muted); }
  #menu .sub.sel { color: var(--text); font-weight: 600; }

  /* chat */
  #chat { display: none; flex: 1 1 auto; min-height: 0; padding: 4px 20px 8px; overflow-y: auto; -webkit-user-select: text; user-select: text; }
  #chat-in { display: flow-root; }
  .msg { margin: 10px 0; }
  .msg.user { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .msg.user .b { background: var(--bubble); border-radius: 20px; padding: 8px 16px; max-width: 85%; white-space: pre-wrap; }
  .msg.user img { max-width: 220px; max-height: 140px; border-radius: 12px; border: 1px solid var(--line); }
  .msg.ai p { margin: 0 0 8px; }
  .msg.ai ul { margin: 0 0 8px; padding-left: 22px; }
  .msg.ai code { background: var(--bubble); border-radius: 4px; padding: 0 4px; font-family: Consolas, monospace; }
  .acts { display: flex; gap: 2px; margin-top: 2px; opacity: .55; }
  .msg:hover .acts { opacity: 1; }
  .acts .ib { width: 28px; height: 28px; }
  .acts .ib.on { background: var(--chip); color: var(--accent); }
  .acts .ib.up.on { color: var(--good); } .acts .ib.down.on { color: var(--bad); }
  .msg.user .acts { justify-content: flex-end; }
  .note { color: var(--muted); font-size: 13px; margin: 4px 0; }
  .err { color: var(--bad); }
  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .sources a { font-size: 12.5px; color: var(--accent); background: var(--chip); border-radius: 12px; padding: 2px 10px;
               cursor: pointer; max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin: 10px 0; }
  .card .step { margin: 4px 0; }
  .card .bar { height: 6px; border-radius: 3px; background: var(--hover); overflow: hidden; margin-top: 6px; }
  .card .bar i { display: block; height: 100%; background: var(--accent); }
  .btn { font: inherit; font-size: 14px; border-radius: 18px; padding: 6px 16px; cursor: pointer; border: 1px solid var(--line);
         background: transparent; color: var(--text); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }

  /* composer */
  .composer { flex: none; margin: 0 14px 14px; border: 1px solid var(--line); border-radius: 24px; background: var(--field);
              padding: 12px 14px 8px; -webkit-app-region: no-drag; cursor: text; }
  #thumbs { display: none; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .thumb { position: relative; }
  .thumb img { height: 56px; max-width: 120px; border-radius: 10px; border: 1px solid var(--line); display: block; }
  .thumb button { position: absolute; top: -7px; right: -7px; width: 20px; height: 20px; border-radius: 50%; border: 0;
                  background: #3c4043; color: #fff; cursor: pointer; font-size: 12px; line-height: 20px; padding: 0; }
  #q { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font: 17px/1.4 "Segoe UI", sans-serif;
       padding: 4px 4px 8px; resize: none; display: block; height: 32px; max-height: 140px; overflow-y: auto;
       -webkit-user-select: text; user-select: text; }
  #q::placeholder { color: var(--muted); }
  .tools { display: flex; align-items: center; gap: 6px; }
  .tools .sp { flex: 1; }
  .quick { display: none; gap: 6px; }
  .quick .btn { padding: 3px 12px; font-size: 13px; }
  #send { display: none; background: var(--accent); color: var(--accent-text); width: 40px; height: 36px; border-radius: 18px; }
  #send:hover { filter: brightness(1.1); background: var(--accent); }
  .dragging .composer { border-color: var(--accent); }

  /* suggestions */
  #sugg { display: none; flex: none; padding: 0 14px 14px; }
  #sugg h4 { margin: 8px 6px 4px; font-weight: 500; font-size: 17px; }
  .row { display: flex; align-items: center; gap: 14px; padding: 9px 12px; cursor: pointer; border-radius: 12px; }
  .row.sel, .row:hover { background: var(--hover); }
  .row .ico { width: 22px; text-align: center; color: var(--muted); }

  /* feedback dialog */
  #modal { display: none; position: absolute; inset: 0; z-index: 10; background: rgba(0,0,0,.45); padding: 16px; overflow-y: auto; }
  #modal .dlg { background: var(--bg); border-radius: 18px; padding: 16px 18px; max-width: 520px; margin: 0 auto; }
  #modal h3 { margin: 0 0 6px; }
  #modal .pre { background: var(--bubble); border-radius: 10px; padding: 8px 12px; margin: 6px 0; max-height: 90px; overflow: auto;
                white-space: pre-wrap; font-size: 13px; -webkit-user-select: text; user-select: text; }
  #modal textarea { width: 100%; height: 50px; border-radius: 10px; border: 1px solid var(--line); background: var(--field);
                    color: var(--text); font: 14px "Segoe UI", sans-serif; padding: 6px 10px; -webkit-user-select: text; user-select: text; }
  #modal .row2 { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  #modal img { height: 44px; border-radius: 8px; margin-right: 6px; }
</style>
</head>
<body>
<div id="wrap">
  <div class="box" id="box">
    <div id="side">
      <h3>Chats</h3>
      <div id="chats"></div>
    </div>

    <div class="main" id="main">
      <div class="top" id="top">
        <button class="ib" id="menu-btn" title="Menu">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h7"/></svg>
        </button>
        <button class="ib" id="new-btn" title="New chat" style="display:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-6"/><path d="M18.5 2.5a2.1 2.1 0 0 1 3 3L12 15l-4 1 1-4z"/></svg>
        </button>
        <div class="mid"><span>🌲</span><span class="keys" id="keys">Alt + Space</span></div>
        <button class="ib" id="pin-btn" title="Keep on top">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6l-1 6 3 3H7l3-3z"/><path d="M12 13v7"/></svg>
        </button>
        <button class="ib" id="close-btn" title="Close">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <div id="chat"></div>

      <div class="composer" id="composer">
        <div id="thumbs"></div>
        <textarea id="q" rows="1" placeholder="Ask anything" spellcheck="false"></textarea>
        <div class="tools">
          <button class="ib" id="plus-btn" title="Add an image">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="ib" id="web-btn" title="Search the web for answers">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>
          </button>
          <div class="quick" id="quick">
            <button class="btn" data-q="Describe this image in detail.">Describe</button>
            <button class="btn" data-q="What is this? Identify the main subject and give the key facts about it.">Identify</button>
            <button class="btn" data-q="Transcribe all the text in this image, then translate it to English.">Translate</button>
          </div>
          <div class="sp"></div>
          <button class="ib" id="lens-btn" title="Select an area of your screen">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M15 4h4a1 1 0 0 1 1 1v4M20 15v4a1 1 0 0 1-1 1h-4M9 20H5a1 1 0 0 1-1-1v-4"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="ib" id="send" title="Ask (Enter)">
            <svg id="send-up" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            <svg id="send-stop" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
          </button>
        </div>
      </div>

      <div id="sugg"></div>
    </div>

    <div id="menu">
      <div id="m-new">New chat</div>
      <div id="m-hist">Chat history <span id="m-hist-c"></span></div>
      <hr>
      <div id="m-top">Keep on top <span id="m-top-c"></span></div>
      <div id="m-task">Show in taskbar <span id="m-task-c"></span></div>
      <div id="m-login">Start with Windows <span id="m-login-c"></span></div>
      <div id="m-hotkey">Change hotkey</div>
      <hr>
      <div style="cursor:default;color:var(--muted);font-size:13px">AI model</div>
      <div id="m-models"></div>
      <hr>
      <div id="m-quit">Quit Tree Lens</div>
    </div>

    <div id="modal"></div>
  </div>
</div>
<script src="bar.js"></script>
</body>
</html>
