<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #shot { position: fixed; inset: 0; width: 100%; height: 100%; }
  #dim { position: fixed; inset: 0; background: rgba(0,0,0,.45); }
  #sel { position: fixed; display: none; border: 2px solid #4ade80; background-image: none;
         box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); }
  #hint { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 8px;
          background: rgba(0,0,0,.75); color: #fff; font: 14px "Segoe UI", sans-serif; pointer-events: none; }
</style>
</head>
<body>
<img id="shot">
<div id="dim"></div>
<div id="sel"></div>
<div id="hint">Drag to select an area &middot; Esc to cancel</div>
<script>
  const shot = document.getElementById("shot");
  const dim = document.getElementById("dim");
  const sel = document.getElementById("sel");
  let start = null, rect = null;

  window.overlay.onImage(url => {
    // The window is reused, so start every selection from a clean state.
    start = null; rect = null;
    sel.style.display = "none";
    dim.style.display = "block";
    shot.src = url;
  });

  function boxFrom(a, b) {
    return { x: Math.min(a.x, b.x), y: Math.min(a.y, b.y), w: Math.abs(a.x - b.x), h: Math.abs(a.y - b.y) };
  }

  window.addEventListener("mousedown", e => {
    start = { x: e.clientX, y: e.clientY };
    dim.style.display = "none";
    sel.style.display = "block";
  });
  window.addEventListener("mousemove", e => {
    if (!start) return;
    rect = boxFrom(start, { x: e.clientX, y: e.clientY });
    Object.assign(sel.style, { left: rect.x + "px", top: rect.y + "px", width: rect.w + "px", height: rect.h + "px" });
  });
  window.addEventListener("mouseup", () => {
    if (!start) return;
    const picked = rect && rect.w > 8 && rect.h > 8 ? rect : null;
    start = null;
    window.overlay.done(picked);
  });
  window.addEventListener("keydown", e => { if (e.key === "Escape") window.overlay.done(null); });
</script>
</body>
</html>
